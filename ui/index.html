<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComplianceGuard Explorer | Multi-Cloud</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image:
                radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(99, 102, 241, 0.1) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem;
            line-height: 1.6;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 1.1rem;
        }

        /* Settings Card */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 1rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            color: white;
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
        }

        /* Search Area */
        .search-area {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .search-input {
            flex: 1;
            font-size: 1.2rem;
            padding: 1rem 1.5rem;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 0 2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        /* Results Grid */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .result-card {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.5rem;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }

        .result-card:hover {
            transform: scale(1.03);
            border-color: rgba(99, 102, 241, 0.4);
            background: rgba(255, 255, 255, 0.08);
        }

        .source-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 99px;
            font-size: 0.75rem;
            font-weight: 700;
            background: var(--primary);
            color: white;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        .score-indicator {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--success);
        }

        .entity-name {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: block;
        }

        .list-type {
            color: var(--text-dim);
            font-size: 0.9rem;
            margin-bottom: 1rem;
            display: block;
        }

        .metadata-box {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            padding: 0.75rem;
            font-size: 0.85rem;
            color: var(--text-dim);
            max-height: 150px;
            overflow-y: auto;
        }

        .metadata-item {
            margin-bottom: 0.25rem;
        }

        .metadata-label {
            color: var(--primary);
            font-weight: 600;
        }

        /* Status & Empty */
        .empty-state,
        .loading-state {
            text-align: center;
            padding: 4rem;
            color: var(--text-dim);
            grid-column: 1 / -1;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--glass);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Responsive */
        @media (max-width: 600px) {
            body {
                padding: 1rem;
            }

            h1 {
                font-size: 2rem;
            }

            .search-area {
                flex-direction: column;
            }

            button {
                height: 50px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>ComplianceGuard Explorer</h1>
            <p class="subtitle">Motor de búsqueda Multi-Cloud sobre Delta Lake</p>
        </header>

        <section class="glass-card">
            <div class="settings-grid">
                <div class="input-group">
                    <label>API Key</label>
                    <input type="password" id="apiKey" placeholder="Introduce tu x-api-key..." value="">
                </div>
                <div class="input-group">
                    <label>API Gateway Endpoint</label>
                    <input type="text" id="apiEndpoint" placeholder="https://..."
                        value="https://9m9yj00e81.execute-api.us-east-1.amazonaws.com/prod">
                </div>
                <div class="input-group" style="flex: 0.5;">
                    <label>Umbral (Score)</label>
                    <input type="number" id="threshold" value="85.0" step="0.5" min="0" max="100">
                </div>
                <div class="input-group" style="flex: 0.3;">
                    <label>Límite</label>
                    <input type="number" id="limit" value="20" min="1" max="100">
                </div>
            </div>

            <div class="search-area">
                <input type="text" id="searchInput" class="search-input" placeholder="Nombre de la persona o entidad..."
                    onkeypress="handleKeyPress(event)">
                <button onclick="performSearch()">
                    🔍 Buscar
                </button>
            </div>
        </section>

        <main id="resultsGrid" class="results-grid">
            <div class="empty-state">
                Haz una búsqueda para comenzar a auditar entidades.
            </div>
        </main>
    </div>

    <script>
        // Cargar API Key de localStorage si existe
        document.getElementById('apiKey').value = localStorage.getItem('compliance_api_key') || 'k03WgCAN6457oU1gJgGjS6Y6tBIYi3z7s4uCjqMa';

        function handleKeyPress(e) {
            if (e.key === 'Enter') performSearch();
        }

        async function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            const apiKey = document.getElementById('apiKey').value.trim();
            const endpoint = document.getElementById('apiEndpoint').value.trim().replace(/\/$/, "");
            const threshold = document.getElementById('threshold').value;
            const limit = document.getElementById('limit').value;
            const resultsGrid = document.getElementById('resultsGrid');

            if (!query) return alert('Por favor, ingresa un nombre para buscar.');
            if (!apiKey) return alert('Se requiere una API Key válida.');

            // Guardar API Key para comodidad
            localStorage.setItem('compliance_api_key', apiKey);

            // UI State: Loading
            resultsGrid.innerHTML = `
                <div class="loading-state">
                    <div class="loading-spinner"></div>
                    <p>Consultando Delta Lake en tiempo real...</p>
                </div>
            `;

            try {
                const url = `${endpoint}/check/?name=${encodeURIComponent(query)}&threshold=${threshold}&limit=${limit}`;

                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'x-api-key': apiKey,
                        'Accept': 'application/json'
                    }
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.detail || 'Error en la respuesta del servidor');
                }

                const data = await response.json();
                renderResults(data);

            } catch (error) {
                resultsGrid.innerHTML = `
                    <div class="empty-state" style="color: var(--danger)">
                        ❌ Error: ${error.message}
                        <p style="font-size: 0.8rem; margin-top: 1rem;">Verifica la URL del endpoint y la API Key.</p>
                    </div>
                `;
            }
        }

        function renderResults(data) {
            const resultsGrid = document.getElementById('resultsGrid');

            if (!data.match_found || data.results.length === 0) {
                resultsGrid.innerHTML = `
                    <div class="empty-state">
                        No se encontraron coincidencias para "${data.query}" con el umbral seleccionado.
                    </div>
                `;
                return;
            }

            resultsGrid.innerHTML = ''; // Limpiar

            data.results.forEach(result => {
                const card = document.createElement('div');
                card.className = 'result-card';

                // Formatear metadata
                let metadataHtml = '';
                if (result.metadata) {
                    metadataHtml = Object.entries(result.metadata)
                        .map(([key, value]) => `
                            <div class="metadata-item">
                                <span class="metadata-label">${key.replace('_', ' ')}:</span> ${value || 'N/A'}
                            </div>
                        `).join('');
                }

                card.innerHTML = `
                    <span class="source-badge">${result.fuente}</span>
                    <span class="score-indicator">${result.score}%</span>
                    <strong class="entity-name">${result.nombre_original}</strong>
                    <span class="list-type">${result.tipo_lista}</span>
                    <div class="metadata-box">
                        ${metadataHtml}
                    </div>
                `;
                resultsGrid.appendChild(card);
            });
        }
    </script>
</body>

</html>
