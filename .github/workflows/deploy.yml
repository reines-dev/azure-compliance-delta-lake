name: Deploy ComplianceGuard to AWS (Nested CloudFormation)

on:
  push:
    branches:
      - main
      - feature/initial-setup
  workflow_dispatch:

env:
  REGION: us-east-1
  SAM_BUCKET: hreines-sam-deploy
  BASE_STACK: reinesdev-compliance
  LAKE_BUCKET: reinesdev-compliance-lake-prd

jobs:
  unit-tests:
    name: 🧪 Unit Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install -r lambdas/requirements-aws.txt
          pip install -r requirements-test.txt
          # Instalar el paquete actual en modo editable para que los tests vean src/
          pip install -e . || true

      - name: 🏃 Run tests with coverage
        run: |
          # Ejecutar tests y fallar si la cobertura es inferior al 80%
          pytest tests/unit/ \
            --cov=src \
            --cov=lambdas \
            --cov=api \
            --cov-report=term-missing \
            --cov-fail-under=80

  enforce-policy:
    name: 🛡️ Enforce PR Policy
    needs: [unit-tests]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Check for Approved PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_DATA=$(gh pr list --state merged --limit 1 --json number,reviewDecision,baseRefName --search "${{ github.sha }}")
          
          if [ -z "$PR_DATA" ] || [ "$PR_DATA" == "[]" ]; then
            echo "⚠️ WARNING: No se pudo verificar el PR asociado. Continuando por política de emergencia."
          else
            DECISION=$(echo $PR_DATA | jq -r '.[0].reviewDecision')
            if [ "$DECISION" != "APPROVED" ]; then
              echo "❌ ERROR: El Pull Request asociado no ha sido APROBADO."
              exit 1
            fi
            echo "✅ Política verificada."
          fi

  deploy:
    name: 🚀 Atomic Deployment
    needs: [unit-tests, enforce-policy]
    # Se ejecuta si los tests pasan Y (es feature branch o (es main y PR policy se cumple))
    if: |
      always() && 
      needs.unit-tests.result == 'success' &&
      (needs.enforce-policy.result == 'success' || needs.enforce-policy.result == 'skipped' || github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ☁️ Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.REGION }}

      - name: 🔑 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 📤 Sync AWS Glue Scripts
        run: |
          aws s3 sync glue/jobs/ s3://${{ env.LAKE_BUCKET }}/system/glue_jobs/ --exclude "*" --include "*.py"

      - name: 🏗️ Prepare Lambda Package
        run: |
          cp -r src/ lambdas/src/

      - name: 🐳 Build, Push & Package
        env:
          ECR_REPOSITORY: reinesdev-compliance-api-repo
          IMAGE_TAG: latest
        run: |
          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          
          if [ -z "$ECR_REGISTRY" ]; then
            echo "❌ ERROR: No se pudo obtener the ECR Registry."
            exit 1
          fi

          IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "🚀 Building image: $IMAGE_URI"

          docker build -t $IMAGE_URI -f api/Dockerfile.aws .
          docker push $IMAGE_URI
          
          aws cloudformation package \
            --template-file infra/root-template.yaml \
            --s3-bucket ${{ env.SAM_BUCKET }} \
            --output-template-file packaged-root.yaml

          aws cloudformation deploy \
            --template-file packaged-root.yaml \
            --stack-name ${{ env.BASE_STACK }}-root \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
            --no-fail-on-empty-changeset \
            --parameter-overrides ImageUri=$IMAGE_URI
