name: Deploy ComplianceGuard to AWS (ELT)

on:
  push:
    branches:
      - main
      - feature/initial-setup
  workflow_dispatch: # Permite ejecución manual desde GitHub UI

env:
  STACK_NAME: reinesdev-compliance-prd
  REGION: us-east-1
  LAKE_BUCKET_NAME: reinesdev-compliance-lake-prd
  SAM_BUCKET: hreines-sam-deploy

jobs:
  enforce-policy:
    name: 🛡️ Enforce PR Policy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: 🔍 Check for Approved PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Buscar el PR asociado a este commit de push
          PR_DATA=$(gh pr list --state merged --limit 1 --json number,reviewDecision,baseRefName --search "${{ github.sha }}")
          
          if [ -z "$PR_DATA" ] || [ "$PR_DATA" == "[]" ]; then
            echo "❌ ERROR: Push directo a 'main' detectado. Los cambios DEBEN pasar por un Pull Request."
            exit 1
          fi
          
          DECISION=$(echo $PR_DATA | jq -r '.[0].reviewDecision')
          BASE=$(echo $PR_DATA | jq -r '.[0].baseRefName')
          
          if [ "$DECISION" != "APPROVED" ]; then
            echo "❌ ERROR: El Pull Request asociado no ha sido APROBADO."
            exit 1
          fi
          
          echo "✅ Política verificada: Cambio originado en un PR aprobado hacia $BASE."

  build-and-deploy:
    needs: enforce-policy
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' || 
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: 🛠️ Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: ☁️ Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.REGION }}

      - name: 📤 Sync AWS Glue PySpark Scripts to S3
        run: |
          aws s3 sync src/glue_jobs/ s3://${{ env.LAKE_BUCKET_NAME }}/system/glue_jobs/ --exclude "*" --include "*.py"

      - name: 🏗️ Build Serverless Application
        run: |
          # SAM build detectará Docker automáticamente en github runners
          sam build --template template.yaml

      - name: 🚀 Deploy Serverless Application
        env:
          DOCKER_CLIENT_TIMEOUT: "300"
          COMPOSE_HTTP_TIMEOUT: "300"
          DOCKER_TIMEOUT: "600"
          AWS_MAX_ATTEMPTS: "10"
        run: |
          sam deploy \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.REGION }} \
            --s3-bucket ${{ env.SAM_BUCKET }} \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
            --no-confirm-changeset \
            --resolve-image-repos \
            --debug
