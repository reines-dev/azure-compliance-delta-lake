name: 🚀 Deploy to Production

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'lambdas/**'
      - 'glue/**'
      - 'infra/**'
  workflow_dispatch:

env:
  REGION: us-east-1
  SAM_BUCKET: ${{ secrets.SAM_DEPLOY_BUCKET || 'hreines-sam-deploy' }}
  PROJECT_NAME: reinesdev-compliance
  FOUNDATION_STACK: reinesdev-compliance-foundation
  APP_STACK: reinesdev-compliance-root

jobs:
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/api/requirements.txt
          pip install -r lambdas/requirements-aws.txt
          pip install -r requirements-test.txt
          pip install -e .
      - name: 🏃 Run tests
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pytest tests/unit/ --cov=src --cov=lambdas --cov-fail-under=80

  deploy-foundation:
    name: 🧱 Deploy Foundation
    needs: [unit-tests]
    runs-on: ubuntu-latest
    outputs:
      bucket_name: ${{ steps.get-outputs.outputs.bucket_name }}
      ecr_uri: ${{ steps.get-outputs.outputs.ecr_uri }}
    steps:
      - uses: actions/checkout@v4
      - name: ☁️ Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.REGION }}

      - name: 🚀 Deploy Foundation Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          name: ${{ env.FOUNDATION_STACK }}
          template: infra/foundation.yaml
          capabilities: CAPABILITY_IAM,CAPABILITY_NAMED_IAM
          no-fail-on-empty-changeset: "1"
          parameter-overrides: "ProjectName=${{ env.PROJECT_NAME }},Environment=prd"

      - name: 📤 Get Foundation Outputs
        id: get-outputs
        run: |
          BUCKET=$(aws cloudformation describe-stacks --stack-name ${{ env.FOUNDATION_STACK }} --query 'Stacks[0].Outputs[?OutputKey==`BucketName`].OutputValue' --output text)
          ECR=$(aws cloudformation describe-stacks --stack-name ${{ env.FOUNDATION_STACK }} --query 'Stacks[0].Outputs[?OutputKey==`EcrRepoUri`].OutputValue' --output text)
          echo "bucket_name=$BUCKET" >> $GITHUB_OUTPUT
          echo "ecr_uri=$ECR" >> $GITHUB_OUTPUT

  deploy-application:
    name: 📱 Deploy Application
    needs: [deploy-foundation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ☁️ Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.REGION }}

      - name: 🔑 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 📤 Sync AWS Glue Scripts
        run: |
          aws s3 sync glue/jobs/ s3://${{ needs.deploy-foundation.outputs.bucket_name }}/system/glue_jobs/ --exclude "*" --include "*.py"

      - name: 🏗️ Prepare & Package Lambdas
        run: |
          cp -r src/ lambdas/src/
          cd lambdas
          zip -r ../extractors.zip .
          cd ..

      - name: 🐳 Build & Push API Image
        env:
          ECR_URI: ${{ needs.deploy-foundation.outputs.ecr_uri }}
        run: |
          docker build -t $ECR_URI:latest -f src/api/Dockerfile.aws .
          docker push $ECR_URI:latest

      - name: 📦 Package CloudFormation
        run: |
          aws cloudformation package \
            --template-file infra/root-template.yaml \
            --s3-bucket ${{ env.SAM_BUCKET }} \
            --output-template-file packaged-root.yaml

      - name: 🚀 Deploy App Stack
        run: |
          aws cloudformation deploy \
            --template-file packaged-root.yaml \
            --stack-name ${{ env.APP_STACK }} \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              FoundationStackName=${{ env.FOUNDATION_STACK }} \
              ImageUri=${{ needs.deploy-foundation.outputs.ecr_uri }}:latest
