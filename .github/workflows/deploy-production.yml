name: 🚀 Deploy to Production

on:
  workflow_dispatch:

jobs:
  unit-tests:
    name: 🧪 Unit Tests & Coverage
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/api/requirements.txt
          pip install -r lambdas/requirements-aws.txt
          pip install -r requirements-test.txt
          pip install -e .

      - name: 🏃 Run tests with coverage
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          # Falla si la cobertura es < 80%
          pytest tests/unit/ \
            --cov=src \
            --cov=lambdas \
            --cov-report=term-missing \
            --cov-fail-under=80

  deploy:
    name: 🌐 Atomic Deployment
    needs: [unit-tests]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☁️ Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.REGION }}

      - name: 🔑 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 📤 Sync AWS Glue Scripts
        run: |
          aws s3 sync glue/jobs/ s3://${{ env.LAKE_BUCKET }}/system/glue_jobs/ --exclude "*" --include "*.py"

      - name: 🏗️ Prepare Lambda Package
        run: |
          cp -r src/ lambdas/src/

      - name: 🐳 Build, Push & Package
        env:
          ECR_REPOSITORY: reinesdev-compliance-api-repo
          IMAGE_TAG: latest
        run: |
          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          if [ -z "$ECR_REGISTRY" ]; then exit 1; fi

          IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "🚀 Building image: $IMAGE_URI"

          docker build -t $IMAGE_URI -f src/api/Dockerfile.aws .
          docker push $IMAGE_URI
          
          aws cloudformation package \
            --template-file infra/root-template.yaml \
            --s3-bucket ${{ env.SAM_BUCKET }} \
            --output-template-file packaged-root.yaml

          aws cloudformation deploy \
            --template-file packaged-root.yaml \
            --stack-name ${{ env.BASE_STACK }}-root \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
            --no-fail-on-empty-changeset \
            --parameter-overrides ImageUri=$IMAGE_URI
